name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/boost/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Booster'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.boost.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.boost.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.HOME" />
                  </intent>
              </queries>
              <application
                  android:label="معزز الأداء"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/boost/app/MainActivity.java <<'EOF'
          package com.boost.app;

          import android.app.Activity;
          import android.app.ActivityManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.AdapterView;
          import android.widget.ArrayAdapter;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  final PackageManager pm = getPackageManager();
                  Intent q = new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER);
                  final List<ResolveInfo> apps = new ArrayList<>();
                  for (ResolveInfo r : pm.queryIntentActivities(q, 0)) {
                      if (!r.activityInfo.packageName.equals(getPackageName())) apps.add(r);
                  }
                  Collections.sort(apps, new ResolveInfo.DisplayNameComparator(pm));
                  List<String> names = new ArrayList<>();
                  for (ResolveInfo r : apps) names.add(r.loadLabel(pm).toString());

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(32, 96, 32, 32);

                  TextView title = new TextView(this);
                  title.setText("اختر التطبيق اللي تبي تركّز عليه");
                  title.setTextSize(20);
                  title.setPadding(0, 0, 0, 24);
                  root.addView(title);

                  ListView list = new ListView(this);
                  list.setAdapter(new ArrayAdapter<>(this, android.R.layout.simple_list_item_1, names));
                  root.addView(list, new LinearLayout.LayoutParams(-1, -1));
                  setContentView(root);

                  list.setOnItemClickListener(new AdapterView.OnItemClickListener() {
                      @Override
                      public void onItemClick(AdapterView<?> p, View v, int pos, long id) {
                          boost(apps, apps.get(pos).activityInfo.packageName);
                      }
                  });
              }

              private void boost(List<ResolveInfo> apps, String target) {
                  ActivityManager am = (ActivityManager) getSystemService(Context.ACTIVITY_SERVICE);
                  ResolveInfo home = getPackageManager().resolveActivity(
                          new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME), 0);
                  String homePkg = home == null ? "" : home.activityInfo.packageName;
                  for (ResolveInfo r : apps) {
                      String p = r.activityInfo.packageName;
                      if (p.equals(target) || p.equals(homePkg)) continue;
                      am.killBackgroundProcesses(p);
                  }
                  Toast.makeText(this, "تم تنظيف الخلفية", Toast.LENGTH_SHORT).show();
                  Intent i = getPackageManager().getLaunchIntentForPackage(target);
                  if (i != null) startActivity(i);
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: APK v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
